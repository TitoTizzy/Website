<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Albums photos | Admin OUH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/main.css?v=20260603e" /><link rel="stylesheet" href="/assets/css/admin.css?v=20260603e" />
  <style>
    .album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.25rem;}
    .album-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s;text-decoration:none;display:flex;flex-direction:column;}
    .album-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);}
    .album-cover{width:100%;height:150px;object-fit:cover;background:var(--color-light);display:block;}
    .album-cover-empty{width:100%;height:150px;background:linear-gradient(135deg,#eef2fb,#dce6fb);display:flex;align-items:center;justify-content:center;color:var(--color-accent);}
    .album-body{padding:.875rem 1rem 1rem;}
    .album-title{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--color-primary);margin-bottom:.2rem;}
    .album-meta{font-size:.75rem;color:var(--color-muted);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
    .modal-box{background:#fff;border-radius:var(--radius-xl);padding:2rem;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(0,0,0,.2);}
    .modal-title{font-family:var(--font-display);font-size:1.2rem;font-weight:700;color:var(--color-primary);margin-bottom:1.25rem;}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="admin-topbar-left">
        <h1 class="admin-topbar-title">Albums photos</h1>
        <div class="admin-breadcrumb"><span>Administration</span><span>/</span><span>Galerie</span></div>
      </div>
      <div class="admin-topbar-right">
        <a href="/galerie.html" class="btn btn-ghost btn-sm" target="_blank">Voir la galerie</a>
        <button class="btn btn-primary btn-sm" id="btn-new-album">+ Nouvel album</button>
        <div class="admin-topbar-user"><div class="admin-topbar-avatar" id="topbar-avatar">SA</div><span id="topbar-name" style="font-size:.875rem;font-weight:600;color:var(--color-dark);">Admin</span></div>
      </div>
    </div>

    <div class="admin-content">
      <div id="albums-loading" style="text-align:center;padding:3rem;color:var(--color-muted);">Chargement des albums…</div>
      <div class="album-grid" id="album-grid" style="display:none;"></div>
      <div id="albums-empty" class="admin-card" style="display:none;text-align:center;padding:3rem;color:var(--color-muted);">
        Aucun album pour l'instant. Cliquez « + Nouvel album » pour commencer.
      </div>
    </div>
  </div>
</div>

<!-- Modal nouvel album -->
<div class="modal-overlay" id="modal-album" style="display:none;" role="dialog" aria-modal="true">
  <div class="modal-box">
    <h2 class="modal-title">Nouvel album</h2>
    <form id="album-form" novalidate>
      <div class="admin-form-group">
        <label class="admin-form-label" for="a-titre">Titre de l'album <span class="required">*</span></label>
        <input id="a-titre" type="text" class="admin-form-input" placeholder="ex: Mission médicale 2024" required />
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="a-desc">Description (optionnel)</label>
        <textarea id="a-desc" class="admin-form-input" rows="2" placeholder="Quelques mots sur cet album…"></textarea>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="a-annee">Année</label>
        <input id="a-annee" type="number" class="admin-form-input" min="1995" max="2030" placeholder="2024" />
      </div>
      <div class="admin-form-group" style="margin-bottom:1rem;">
        <label class="admin-form-label" for="a-status">Statut</label>
        <select id="a-status" class="admin-form-input admin-form-select">
          <option value="published" selected>Publié</option>
          <option value="draft">Masqué</option>
        </select>
      </div>
      <div id="album-error" style="display:none;background:#fee2e2;border:1px solid #dc2626;border-radius:8px;padding:.55rem .8rem;font-size:.78rem;color:#991b1b;margin-bottom:.75rem;"></div>
      <div style="display:flex;gap:.75rem;justify-content:flex-end;">
        <button type="button" id="btn-cancel-album" class="btn btn-ghost btn-sm">Annuler</button>
        <button type="submit" class="btn btn-primary btn-sm">Créer l'album</button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/js/storage.js?v=20260603e"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js?v=20260603e"></script>
<script src="/assets/js/supabase-data.js?v=20260603e"></script>
<script src="/assets/js/auth.js?v=20260603e"></script>
<script src="/assets/js/supabase-auth.js?v=20260603e"></script>
<script src="/assets/js/admin-ui.js?v=20260603e"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const user = await AdminUI.init({ page: 'galeries' });
  await DataStore.init();

  let albums = [];

  async function load() {
    try { albums = await DataStore.getAllAlbums(); } catch(e) { albums = []; }
    // compter les photos par album
    let counts = {};
    try {
      const all = await DataStore.getAll('galeries');
      all.forEach(p => { if (p.albumId) counts[p.albumId] = (counts[p.albumId]||0)+1; });
    } catch(_){}
    render(counts);
  }

  function render(counts) {
    document.getElementById('albums-loading').style.display = 'none';
    const grid = document.getElementById('album-grid');
    const empty = document.getElementById('albums-empty');
    if (!albums.length) { grid.style.display='none'; empty.style.display='block'; return; }
    empty.style.display='none'; grid.style.display='grid';
    grid.innerHTML = albums.map(a => `
      <a class="album-card" href="/admin/galerie/album.html?id=${a.id}">
        ${a.coverUrl
          ? `<img class="album-cover" src="${a.coverUrl}" alt="${(a.titre||'').replace(/"/g,'')}" loading="lazy">`
          : `<div class="album-cover-empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
        <div class="album-body">
          <div class="album-title">${a.titre || '(Sans titre)'}</div>
          <div class="album-meta">
            <span>${counts[a.id]||0} photo${(counts[a.id]||0)>1?'s':''}</span>
            ${a.annee ? '<span>· '+a.annee+'</span>' : ''}
            ${a.status==='draft' ? '<span class="badge badge-gray">Masqué</span>' : '<span class="badge badge-green">Publié</span>'}
          </div>
        </div>
      </a>`).join('');
  }

  /* Modal création d'album */
  const modal = document.getElementById('modal-album');
  document.getElementById('btn-new-album').addEventListener('click', ()=> modal.style.display='flex');
  document.getElementById('btn-cancel-album').addEventListener('click', ()=> modal.style.display='none');
  modal.addEventListener('click', e=>{ if(e.target===e.currentTarget) modal.style.display='none'; });

  document.getElementById('album-form').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('album-error'); err.style.display='none';
    const titre = document.getElementById('a-titre').value.trim();
    if (!titre) { err.style.display='block'; err.textContent='Le titre est obligatoire.'; return; }
    try {
      const maxOrdre = albums.length ? Math.max(...albums.map(a=>a.ordre||0)) : 0;
      const album = await DataStore.create('albums', {
        titre,
        description: document.getElementById('a-desc').value.trim(),
        annee: parseInt(document.getElementById('a-annee').value) || null,
        status: document.getElementById('a-status').value || 'published',
        ordre: maxOrdre + 1
      });
      await DataStore.logAction(user?.id, 'album.create', { titre });
      AdminUI.toast('Album créé ! Ajoutez-y des photos.','success');
      window.location.href = '/admin/galerie/album.html?id=' + album.id;
    } catch(ex){ err.style.display='block'; err.textContent='Erreur : '+(ex.message||'création impossible'); }
  });

  await load();
});
</script>
</body></html>
