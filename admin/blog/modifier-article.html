<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modifier article | Admin OUH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/main.css?v=20260603e" /><link rel="stylesheet" href="/assets/css/admin.css?v=20260603e" />
  <style>
    .editor-layout{display:grid;grid-template-columns:1fr 280px;gap:1.5rem;align-items:start;}
    @media(max-width:900px){.editor-layout{grid-template-columns:1fr;}}
    .editor-side{background:var(--color-surface);border-radius:var(--radius-lg);border:1px solid var(--color-border);padding:1.25rem;box-shadow:var(--shadow-sm);position:sticky;top:80px;margin-bottom:1rem;}
    .admin-form-textarea{min-height:320px;font-family:monospace;font-size:.85rem;line-height:1.6;}
    .char-count{font-size:.72rem;color:var(--color-muted);text-align:right;margin-top:.25rem;}
    .meta-bar{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:.75rem;color:var(--color-muted);padding:.55rem .875rem;background:var(--color-light);border-radius:8px;margin-bottom:1.25rem;}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="admin-topbar-left">
        <h1 class="admin-topbar-title" id="topbar-title">Modifier l'article</h1>
        <div class="admin-breadcrumb"><a href="/admin/blog/liste-articles.html" style="color:inherit;">Articles</a><span>/</span><span>Modifier</span></div>
      </div>
      <div class="admin-topbar-right">
        <a href="/admin/blog/liste-articles.html" class="btn btn-ghost btn-sm">← Retour</a>
        <div class="admin-topbar-user">
          <div class="admin-topbar-avatar" id="topbar-avatar">SA</div>
          <span id="topbar-name" style="font-size:.875rem;font-weight:600;color:var(--color-dark);">Admin</span>
        </div>
      </div>
    </div>
    <div class="admin-content">
      <div id="state-loading" class="admin-card" style="text-align:center;padding:3rem;"><p style="color:var(--color-muted);">Chargement…</p></div>
      <div id="state-notfound" class="admin-card" style="display:none;text-align:center;padding:3rem;"><p style="color:var(--color-error);font-weight:600;">Article introuvable.</p><a href="/admin/blog/liste-articles.html" class="btn btn-primary btn-sm" style="margin-top:1rem;">← Retour</a></div>

      <form id="article-form" novalidate style="display:none;">
        <div class="meta-bar">
          <span>ID : <code id="meta-id" style="font-family:monospace;font-size:.7rem;"></code></span>
          <span>Créé le <span id="meta-created"></span></span>
          <span>Mis à jour le <span id="meta-updated"></span></span>
        </div>
        <div class="editor-layout">
          <div>
            <div class="admin-card" style="margin-bottom:1.5rem;">
              <div class="admin-form-group">
                <label class="admin-form-label" for="f-title">Titre <span class="required">*</span></label>
                <input id="f-title" type="text" class="admin-form-input" style="font-size:1.05rem;font-weight:600;" required />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label" for="f-excerpt">Résumé <span class="required">*</span></label>
                <textarea id="f-excerpt" class="admin-form-input" rows="3" style="min-height:75px;resize:vertical;" maxlength="220" required></textarea>
                <div class="char-count"><span id="excerpt-count">0</span>/220</div>
              </div>
              <div class="admin-form-group" style="margin-bottom:0;">
                <label class="admin-form-label" for="f-content">Contenu <span class="required">*</span> <span style="font-weight:400;font-size:.7rem;color:var(--color-muted);">HTML autorisé</span></label>
                <textarea id="f-content" class="admin-form-input admin-form-textarea" rows="16" required></textarea>
              </div>
            </div>
            <div class="admin-card">
              <h3 style="font-size:.95rem;font-weight:700;margin-bottom:.875rem;">Image à la une</h3>
              <div class="admin-form-group">
                <label class="admin-form-label" for="f-image-file">Remplacer la photo (optionnel)</label>
                <input id="f-image-file" type="file" class="admin-form-input" accept="image/png,image/jpeg,image/webp,image/gif" style="padding:.5rem;cursor:pointer;" />
                <p style="font-size:.72rem;color:var(--color-muted);margin-top:.25rem;">Laissez vide pour garder l'image actuelle.</p>
                <div id="cover-preview" style="margin-top:.75rem;display:none;"><img style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;" alt="Aperçu" /></div>
                <input id="f-image" type="hidden" />
              </div>
              <div class="admin-form-group" style="margin-bottom:0;"><label class="admin-form-label" for="f-alt">Texte alt</label><input id="f-alt" type="text" class="admin-form-input" /></div>
            </div>
            <div class="admin-card">
              <h3 style="font-size:.95rem;font-weight:700;margin-bottom:.75rem;">Images dans l'article</h3>
              <p style="font-size:.8rem;color:var(--color-muted);margin-bottom:1rem;line-height:1.6;">Insère l'image à la position du curseur dans le contenu.</p>
              <label for="f-content-img" class="btn btn-outline btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Insérer une image
              </label>
              <input id="f-content-img" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />
            </div>
          </div>
          <div>
            <div class="editor-side">
              <h3 style="font-size:.9rem;font-weight:700;margin-bottom:.875rem;">Publication</h3>
              <div class="admin-form-group"><label class="admin-form-label" for="f-status">Statut</label>
                <select id="f-status" class="admin-form-input admin-form-select">
                  <option value="draft">Brouillon</option><option value="published">Publié</option><option value="archived">Archivé</option>
                </select>
              </div>
              <div class="admin-form-group" style="margin-bottom:.75rem;"><label class="admin-form-label" for="f-category">Catégorie <span class="required">*</span></label>
                <select id="f-category" class="admin-form-input admin-form-select" required>
                  <option value="">— Choisir —</option>
                  <option value="sante">Santé</option><option value="education">Éducation</option><option value="humanitaire">Humanitaire</option><option value="evenements">Événements</option>
                </select>
              </div>
              <hr style="border:none;border-top:1px solid var(--color-border);margin:.875rem 0;">
              <button type="submit" class="btn btn-primary btn-sm" style="width:100%;margin-bottom:.5rem;">💾 Enregistrer</button>
              <button type="button" id="btn-delete" class="btn btn-sm" style="width:100%;background:rgba(220,38,38,.08);color:var(--color-error);border:1px solid rgba(220,38,38,.2);">🗑 Supprimer</button>
              <div id="form-error" style="display:none;margin-top:.75rem;background:#fee2e2;border:1px solid #dc2626;border-radius:8px;padding:.55rem .8rem;font-size:.78rem;color:#991b1b;"></div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="/assets/js/storage.js?v=20260603e"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js?v=20260603e"></script>
<script src="/assets/js/supabase-data.js?v=20260603e"></script><script src="/assets/js/auth.js?v=20260603e"></script>
<script src="/assets/js/supabase-auth.js?v=20260603e"></script><script src="/assets/js/blog.js?v=20260603e"></script><script src="/assets/js/admin-ui.js?v=20260603e"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const user = await AdminUI.init({ page:'articles', roles:['superadmin','admin_general','admin_blog'] });
  await DataStore.init();
  const id = AdminUI.getParam('id');
  if (!id) { show('notfound'); return; }

  let article;
  try { article = await DataStore.getById('articles', id); } catch{ article=null; }
  if (!article) { show('notfound'); return; }

  show('form');
  document.getElementById('topbar-title').textContent = AdminUI.truncate(article.title||'Modifier',45);
  document.getElementById('meta-id').textContent      = article.id;
  document.getElementById('meta-created').textContent = AdminUI.formatDate(article.createdAt, true);
  document.getElementById('meta-updated').textContent = AdminUI.formatDate(article.updatedAt, true);

  const v = (el,val) => { const e=document.getElementById(el); if(e) e.value=val||''; };
  v('f-title',article.title); v('f-excerpt',article.excerpt); v('f-content',article.content);
  v('f-image',article.image); v('f-alt',article.alt); v('f-status',article.status||'draft'); v('f-category',article.category);
  document.getElementById('excerpt-count').textContent=(article.excerpt||'').length;

  document.getElementById('f-excerpt').addEventListener('input',e=>{ document.getElementById('excerpt-count').textContent=e.target.value.length; });

  /* Aperçu de l'image actuelle */
  if (article.image && !article.image.includes('placeholder')) {
    const box = document.getElementById('cover-preview');
    box.style.display='block'; box.querySelector('img').src = article.image;
  }

  /* ── Upload d'images ── */
  const MAX_BYTES = 5 * 1024 * 1024;
  async function uploadOr64(file, prefix) {
    if (window.SUPABASE_READY && DataStore.uploadImage) return DataStore.uploadImage(file, prefix);
    return new Promise(res => { const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); });
  }
  document.getElementById('f-image-file').addEventListener('change', async ev => {
    const file = ev.target.files && ev.target.files[0]; if(!file) return;
    if (file.size > MAX_BYTES) { AdminUI.toast('Image trop lourde (max 5 Mo).','error'); ev.target.value=''; return; }
    AdminUI.toast('Téléversement…','info');
    try { const url = await uploadOr64(file,'articles');
      document.getElementById('f-image').value = url;
      const box=document.getElementById('cover-preview'); box.style.display='block'; box.querySelector('img').src=url;
      AdminUI.toast('Image à la une mise à jour.','success');
    } catch(err){ AdminUI.toast('Erreur : '+(err.message||'upload'),'error'); }
  });
  document.getElementById('f-content-img').addEventListener('change', async ev => {
    const file = ev.target.files && ev.target.files[0]; if(!file) return;
    if (file.size > MAX_BYTES) { AdminUI.toast('Image trop lourde (max 5 Mo).','error'); ev.target.value=''; return; }
    AdminUI.toast('Téléversement…','info');
    try { const url = await uploadOr64(file,'articles');
      const ta=document.getElementById('f-content');
      const snippet=`\n<img src="${url}" alt="" style="width:100%;border-radius:8px;margin:1rem 0;">\n`;
      const pos=ta.selectionStart ?? ta.value.length;
      ta.value = ta.value.slice(0,pos)+snippet+ta.value.slice(pos); ta.focus();
      AdminUI.toast('Image insérée.','success');
    } catch(err){ AdminUI.toast('Erreur : '+(err.message||'upload'),'error'); }
    ev.target.value='';
  });

  let saving=false;
  document.getElementById('article-form').addEventListener('submit', async e=>{
    e.preventDefault(); if(saving) return; saving=true;
    const err=document.getElementById('form-error'); err.style.display='none';
    const g=id=>document.getElementById(id).value.trim();
    const title=g('f-title'),excerpt=g('f-excerpt'),content=g('f-content'),category=g('f-category');
    if(!title||!excerpt||!content||!category){ err.style.display='block'; err.textContent='Tous les champs obligatoires doivent être remplis.'; saving=false; return; }
    const slugify=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').trim();
    const status=g('f-status');
    try {
      await DataStore.update('articles', id, { title,excerpt,content,category,status,
        slug:slugify(title), image:g('f-image')||'assets/images/placeholder.svg', alt:g('f-alt')||title,
        publishedAt: status==='published'?(article.publishedAt||new Date().toISOString()):article.publishedAt });
      await DataStore.logAction(user?.id,'blog.update',{id,title});
      AdminUI.toast('Article mis à jour !','success');
      setTimeout(()=>{ window.location.href='/admin/blog/liste-articles.html'; },800);
    } catch(ex){ err.style.display='block'; err.textContent='Erreur : '+(ex.message||'Echec sauvegarde'); saving=false; }
  });

  document.getElementById('btn-delete').addEventListener('click', async()=>{
    if(!AdminUI.confirm(`Supprimer « ${article.title} » définitivement ?`)) return;
    try{ await DataStore.delete('articles',id); AdminUI.toast('Article supprimé.','success'); setTimeout(()=>{ window.location.href='/admin/blog/liste-articles.html'; },700); }
    catch{ AdminUI.toast('Erreur suppression.','error'); }
  });

  function show(state){
    document.getElementById('state-loading').style.display  = state==='loading'  ?'block':'none';
    document.getElementById('state-notfound').style.display = state==='notfound' ?'block':'none';
    document.getElementById('article-form').style.display   = state==='form'     ?'block':'none';
  }
});
</script>
</body></html>
