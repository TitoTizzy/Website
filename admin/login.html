<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion | Administration OUH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css?v=20260603e" />
  <link rel="stylesheet" href="../assets/css/animations.css?v=20260603e" />
  <link rel="stylesheet" href="../assets/css/admin.css?v=20260603e" />
</head>
<body>

<div class="admin-login-page">
  <div class="admin-login-card">

    <div class="admin-login-logo">
      <img src="../assets/images/logo/logo.png" alt="Logo OUH" width="80" height="80" style="object-fit:contain;border-radius:12px;background:rgba(255,255,255,0.08);padding:8px;">
    </div>

    <h1 class="admin-login-title">Espace Administration</h1>
    <p class="admin-login-subtitle">Connectez-vous pour acceder au tableau de bord</p>

    <form id="login-form" novalidate>
      <div class="admin-form-group">
        <label class="admin-login-label" for="username">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          name="username"
          class="admin-login-input"
          placeholder="superadmin"
          autocomplete="username"
          required
          aria-required="true"
        />
      </div>

      <div class="admin-form-group" style="margin-top:1.25rem;">
        <label class="admin-login-label" for="password">Mot de passe</label>
        <div style="position:relative;">
          <input
            type="password"
            id="password"
            name="password"
            class="admin-login-input"
            placeholder="••••••••••••"
            autocomplete="current-password"
            required
            aria-required="true"
            style="padding-right:3rem;"
          />
          <button
            type="button"
            id="toggle-password"
            aria-label="Afficher/masquer le mot de passe"
            style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.5);"
          >
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:0.75rem;margin-top:1rem;">
        <input type="checkbox" id="remember" name="remember" style="accent-color:#4169E1;width:16px;height:16px;cursor:pointer;" />
        <label for="remember" style="font-size:0.875rem;color:rgba(255,255,255,0.6);cursor:pointer;">Rester connecte</label>
      </div>

      <div class="admin-login-error" id="login-error" role="alert"></div>
      <div id="lockout-msg" style="display:none;background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.2);border-radius:8px;padding:0.75rem 1rem;font-size:0.875rem;color:#fca5a5;margin-top:1rem;" role="alert"></div>

      <button type="submit" class="btn btn-accent" style="width:100%;margin-top:1.5rem;justify-content:center;" id="login-btn">
        Se connecter
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.8rem;color:rgba(255,255,255,0.35);">
      Mot de passe oublie ? Contactez le SuperAdmin
    </p>

    <div style="text-align:center;margin-top:1.5rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.08);">
      <a href="../index.html" style="font-size:0.8rem;color:rgba(255,255,255,0.4);transition:color 0.2s;">
        ← Retour au site public
      </a>
    </div>

  </div>
</div>

<script src="../assets/js/storage.js?v=20260603e" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="../assets/js/supabase-config.js?v=20260603e" defer></script>
<script src="../assets/js/supabase-data.js?v=20260603e" defer></script>
<script src="../assets/js/auth.js?v=20260603e" defer></script>
<script src="../assets/js/supabase-auth.js?v=20260603e" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Message si la déconnexion précédente était due à l'inactivité
  try {
    if (sessionStorage.getItem('ouh_logout_reason') === 'idle') {
      sessionStorage.removeItem('ouh_logout_reason');
      const m = document.getElementById('lockout-msg');
      if (m) { m.style.display = 'block'; m.textContent = 'Vous avez été déconnecté automatiquement après 15 minutes d\'inactivité. Reconnectez-vous.'; }
    }
  } catch (_) {}

  // Toggle show/hide password
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eye-icon');

  toggleBtn?.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.innerHTML = isPassword
      ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  // Form submit — handled by auth.js
  const form = document.getElementById('login-form');
  if (form && window.Auth) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      btn.disabled = true;
      btn.textContent = 'Connexion...';

      try {
        const result = await window.Auth.login(username, password);
        if (result.success) {
          window.location.href = 'dashboard.html';
        } else {
          errorEl.textContent = result.error || 'Identifiants incorrects.';
          errorEl.classList.add('visible');
        }
      } catch (err) {
        errorEl.textContent = 'Erreur de connexion. Reessayez.';
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  }
});
</script>
</body>
</html>
